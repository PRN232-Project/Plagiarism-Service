syntax = "proto3";

package PRN232.Common.Grpc;

service AuthGrpcService {
    rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse);
}

message VerifyTokenRequest {
    string token = 1;
}

message VerifyTokenResponse {
    bool is_valid = 1;
    string user_id = 2;
    string username = 3;
    string role = 4;
}
